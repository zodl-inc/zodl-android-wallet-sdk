# Expected secrets
# MAVEN_CENTRAL_USERNAME - Username for Maven Central.
# MAVEN_CENTRAL_PASSWORD - Password for Maven Central.
# MAVEN_SIGNING_KEY_ASCII - GPG key without a password which has ASCII-armored and then BASE64-encoded.

name: Deploy Release

on:
  workflow_dispatch:

concurrency: deploy_release

# The OHTTP endpoint configuration that zodl-ohttp-client (zodl-inc/zodl-ohttp) reads when
# backend-lib is compiled: gateway hosts, relay URLs, signing public keys and DNS TXT names of the
# signed key configuration. The crate has no built-in endpoints: a network left unset has OHTTP
# off in the built library. Workflow-level, so every step inherits it, Gradle passes it on to the
# cargo builds of rust-android-gradle, and `make test-rust` / clippy see it too. The Rust unit
# tests do not depend on it (they use example endpoints). Repository Actions secrets, managed in
# zodl-inc/github-config: secrets, not variables, so that GitHub masks the values in the log
# (variables are printed in clear in the env listing of every step).
env:
  ZODL_OHTTP_GATEWAY_HOST_MAINNET: ${{ secrets.ZODL_OHTTP_GATEWAY_HOST_MAINNET }}
  ZODL_OHTTP_GATEWAY_HOST_TESTNET: ${{ secrets.ZODL_OHTTP_GATEWAY_HOST_TESTNET }}
  ZODL_OHTTP_RELAY_URL_MAINNET: ${{ secrets.ZODL_OHTTP_RELAY_URL_MAINNET }}
  ZODL_OHTTP_RELAY_URL_TESTNET: ${{ secrets.ZODL_OHTTP_RELAY_URL_TESTNET }}
  ZODL_OHTTP_SIGNING_PUBKEY_MAINNET: ${{ secrets.ZODL_OHTTP_SIGNING_PUBKEY_MAINNET }}
  ZODL_OHTTP_SIGNING_PUBKEY_TESTNET: ${{ secrets.ZODL_OHTTP_SIGNING_PUBKEY_TESTNET }}
  ZODL_OHTTP_KEYS_DNS_NAME_MAINNET: ${{ secrets.ZODL_OHTTP_KEYS_DNS_NAME_MAINNET }}
  ZODL_OHTTP_KEYS_DNS_NAME_TESTNET: ${{ secrets.ZODL_OHTTP_KEYS_DNS_NAME_TESTNET }}

jobs:
  validate_gradle_wrapper:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        timeout-minutes: 1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # No job here pushes or otherwise re-uses the checkout credential, so keep it
          # out of .git/config where it would be picked up by artifact uploads.
          persist-credentials: false
      - name: Gradle Wrapper Validation
        timeout-minutes: 1
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

  check_secrets:
    environment: deployment
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      has-secrets: ${{ steps.check_secrets.outputs.defined }}
    steps:
      - id: check_secrets
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_SIGNING_KEY: ${{ secrets.MAVEN_SIGNING_KEY_ASCII }}
        if: "${{ env.MAVEN_CENTRAL_USERNAME != '' && env.MAVEN_CENTRAL_PASSWORD != '' && env.MAVEN_SIGNING_KEY != '' }}"
        run: echo "defined=true" >> $GITHUB_OUTPUT

  deploy_release:
    environment: deployment
    needs: [validate_gradle_wrapper, check_secrets]
    if: needs.check_secrets.outputs.has-secrets == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        timeout-minutes: 1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # No job here pushes or otherwise re-uses the checkout credential, so keep it
          # out of .git/config where it would be picked up by artifact uploads.
          persist-credentials: false
      - name: Setup
        id: setup
        timeout-minutes: 50
        uses: ./.github/actions/setup
        with:
          cargo-app-id: ${{ secrets.CARGO_PRIVATE_APP_ID }}
          cargo-app-private-key: ${{ secrets.CARGO_PRIVATE_APP_KEY }}
          rust-cache: true
      # Build the release artifact with Rust dependencies (requires cargo app credentials
      # for private git dependencies). Warm-cache builds complete in <30 minutes.
      - name: Build release
        timeout-minutes: 30
        run: |
          ./gradlew :backend-lib:assembleRelease
      # Release guard. Nothing in this step prints a value of the OHTTP configuration (relay URLs,
      # gateway hosts, signing keys, DNS names) or anything derived from one: errors name the
      # variable or secret only.
      # Fails if any of the eight ZODL_OHTTP_* variables is missing (a library built without it has
      # OHTTP off for that network), if the relay URLs the library was built with are not exactly
      # the expected ones (guards against an accidental override), if the independent-relay digests
      # in OhttpCodec.kt do not match them, or if the built .so files do not contain the relay URLs
      # and gateway hosts.
      - name: Guard OHTTP endpoint configuration in release
        timeout-minutes: 5
        env:
          EXPECTED_RELAY_URL_MAINNET: ${{ secrets.ZODL_OHTTP_EXPECTED_RELAY_URL_MAINNET }}
          EXPECTED_RELAY_URL_TESTNET: ${{ secrets.ZODL_OHTTP_EXPECTED_RELAY_URL_TESTNET }}
        run: |
          missing=0
          for name in \
            ZODL_OHTTP_GATEWAY_HOST_MAINNET ZODL_OHTTP_GATEWAY_HOST_TESTNET \
            ZODL_OHTTP_RELAY_URL_MAINNET ZODL_OHTTP_RELAY_URL_TESTNET \
            ZODL_OHTTP_SIGNING_PUBKEY_MAINNET ZODL_OHTTP_SIGNING_PUBKEY_TESTNET \
            ZODL_OHTTP_KEYS_DNS_NAME_MAINNET ZODL_OHTTP_KEYS_DNS_NAME_TESTNET; do
            if [ -z "${!name}" ]; then
              echo "ERROR: $name is not set (repository Actions secret, zodl-inc/github-config)."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "A release library built without it would have OHTTP off for that network."
            exit 1
          fi

          # The expected URLs come from secrets, not from this file. An empty value would make grep -F
          # match every file, and a value with whitespace or a newline would be split into several
          # patterns, so the guard refuses to run without clean values. The same holds for the
          # configured gateway hosts and relay URLs searched in the .so below.
          for name in \
            EXPECTED_RELAY_URL_MAINNET EXPECTED_RELAY_URL_TESTNET \
            ZODL_OHTTP_RELAY_URL_MAINNET ZODL_OHTTP_RELAY_URL_TESTNET \
            ZODL_OHTTP_GATEWAY_HOST_MAINNET ZODL_OHTTP_GATEWAY_HOST_TESTNET; do
            case "${!name}" in
              ""|*[[:space:]]*)
                echo "ERROR: $name is required for this guard, without whitespace."
                echo "(EXPECTED_RELAY_URL_* = secrets ZODL_OHTTP_EXPECTED_RELAY_URL_MAINNET / _TESTNET.)"
                exit 1
                ;;
            esac
          done
          # The relay URLs are build-time configuration now, so instead of refusing any
          # ZODL_OHTTP_RELAY_URL_* the guard against an accidental override requires them to be byte for
          # byte the expected ones: a release cannot ship another relay (a simulator, a typo).
          for net in MAINNET TESTNET; do
            configured="ZODL_OHTTP_RELAY_URL_$net"
            expected="EXPECTED_RELAY_URL_$net"
            if [ "${!configured}" != "${!expected}" ]; then
              echo "ERROR: $configured differs from the secret ZODL_OHTTP_EXPECTED_RELAY_URL_$net."
              echo "Release builds must use the expected relay URLs."
              exit 1
            fi
          done
          # The independent-relay check in OhttpCodec.kt lists SHA-256 digests of the relay URLs. They must be
          # the digests of the URLs this release ships, or every user would see the connection as not private.
          CODEC="lightwallet-client-lib/src/main/java/co/electriccoin/lightwallet/client/OhttpCodec.kt"
          for name in EXPECTED_RELAY_URL_MAINNET EXPECTED_RELAY_URL_TESTNET; do
            digest=$(printf '%s' "${!name}" | sha256sum | cut -d' ' -f1)
            if ! grep -F -q "$digest" "$CODEC"; then
              echo "ERROR: the SHA-256 digest of $name is not listed in $CODEC."
              echo "The independent-relay check would report the release connection as not private."
              exit 1
            fi
          done

          # Only libzcashwalletsdk.so links the OHTTP client; other native libs are not expected
          # to embed the endpoint configuration.
          SO_FILES=$(find backend-lib/build/intermediates -name "libzcashwalletsdk.so" -type f)
          if [ -z "$SO_FILES" ]; then
            echo "ERROR: No libzcashwalletsdk.so found after assembleRelease"
            exit 1
          fi

          for so in $SO_FILES; do
            for name in \
              EXPECTED_RELAY_URL_MAINNET EXPECTED_RELAY_URL_TESTNET \
              ZODL_OHTTP_GATEWAY_HOST_MAINNET ZODL_OHTTP_GATEWAY_HOST_TESTNET; do
              if ! grep -a -F -q "${!name}" "$so"; then
                echo "ERROR: $so does not contain the value of $name."
                echo "This indicates a build-time override or incorrect endpoint embedding."
                exit 1
              fi
            done
          done

          echo "OHTTP guard passed: all libzcashwalletsdk.so files contain the expected mainnet and testnet relay URLs and the configured gateway hosts"
      # Note that GitHub Actions appears to have issues with environment variables that contain periods,
      # so the GPG variables are done as command line arguments instead.
      - name: Deploy to Maven Central
        timeout-minutes: 8
        env:
          ORG_GRADLE_PROJECT_IS_SNAPSHOT: false
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_ZCASH_ASCII_GPG_KEY: ${{ secrets.MAVEN_SIGNING_KEY_ASCII }}
        run: |
          ./gradlew publishToMavenCentral
      - name: Collect Artifacts
        timeout-minutes: 1
        if: ${{ always() }}
        env:
          ARTIFACTS_DIR_PATH: ${{ format('{0}/artifacts', env.home) }}
          BINARIES_ZIP_PATH: ${{ format('{0}/artifacts/release_binaries.zip', env.home) }}
        run: |
          mkdir ${ARTIFACTS_DIR_PATH}

          zip -r ${BINARIES_ZIP_PATH} . -i *build/outputs/*
      - name: Upload Artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        timeout-minutes: 10
        with:
          name: Release binaries
          path: ~/artifacts
