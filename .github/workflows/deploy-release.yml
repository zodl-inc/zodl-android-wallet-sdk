# Expected secrets
# MAVEN_CENTRAL_USERNAME - Username for Maven Central.
# MAVEN_CENTRAL_PASSWORD - Password for Maven Central.
# MAVEN_SIGNING_KEY_ASCII - GPG key without a password which has ASCII-armored and then BASE64-encoded.

name: Deploy Release

on:
  workflow_dispatch:

concurrency: deploy_release

jobs:
  validate_gradle_wrapper:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        timeout-minutes: 1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # No job here pushes or otherwise re-uses the checkout credential, so keep it
          # out of .git/config where it would be picked up by artifact uploads.
          persist-credentials: false
      - name: Gradle Wrapper Validation
        timeout-minutes: 1
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

  check_secrets:
    environment: deployment
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      has-secrets: ${{ steps.check_secrets.outputs.defined }}
    steps:
      - id: check_secrets
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_SIGNING_KEY: ${{ secrets.MAVEN_SIGNING_KEY_ASCII }}
        if: "${{ env.MAVEN_CENTRAL_USERNAME != '' && env.MAVEN_CENTRAL_PASSWORD != '' && env.MAVEN_SIGNING_KEY != '' }}"
        run: echo "defined=true" >> $GITHUB_OUTPUT

  deploy_release:
    environment: deployment
    needs: [validate_gradle_wrapper, check_secrets]
    if: needs.check_secrets.outputs.has-secrets == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        timeout-minutes: 1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # No job here pushes or otherwise re-uses the checkout credential, so keep it
          # out of .git/config where it would be picked up by artifact uploads.
          persist-credentials: false
      - name: Setup
        id: setup
        timeout-minutes: 50
        uses: ./.github/actions/setup
        with:
          cargo-app-id: ${{ secrets.CARGO_PRIVATE_APP_ID }}
          cargo-app-private-key: ${{ secrets.CARGO_PRIVATE_APP_KEY }}
          rust-cache: true
      # Build the release artifact with Rust dependencies (requires cargo app credentials
      # for private git dependencies). Warm-cache builds complete in <30 minutes.
      # The library carries no OHTTP configuration (the app passes it in at runtime), so no
      # OHTTP value is involved: this job needs only the Maven and Cargo App secrets.
      - name: Build release
        timeout-minutes: 30
        run: |
          ./gradlew :backend-lib:assembleRelease
      # The library carries no OHTTP endpoint (the app passes it in at runtime). Fails the release if a
      # zodl.com host other than the vote servers listed in OHTTP_VOTE_HOSTS (voting/route.rs) is
      # embedded in a built libzcashwalletsdk.so, so a gateway or relay host never reaches Maven Central.
      - name: Refuse embedded endpoints in the release library
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          allowed=$(awk '/const OHTTP_VOTE_HOSTS/,/\];/' backend-lib/src/main/rust/voting/route.rs \
            | grep -oE '"[a-z0-9.-]+\.zodl\.com"' | tr -d '"' | sort -u)
          if [ -z "$allowed" ]; then
            echo "::error::No zodl.com host found in OHTTP_VOTE_HOSTS; the allowlist could not be read."
            exit 1
          fi
          mapfile -t libraries < <(find backend-lib/build -name 'libzcashwalletsdk.so' -type f)
          if [ "${#libraries[@]}" -eq 0 ]; then
            echo "::error::No libzcashwalletsdk.so found under backend-lib/build."
            exit 1
          fi
          # Rust packs string literals back to back, so a host may sit next to other text: remove every
          # allowed host (longest first) and fail on any zodl.com left. Prints no host name.
          pattern=$(awk '{ print length, $0 }' <<< "$allowed" | sort -rn | cut -d' ' -f2- \
            | sed 's/\./\\./g' | paste -sd'|')
          failed=0
          for library in "${libraries[@]}"; do
            left=$(strings "$library" | sed -E "s/($pattern)//g" | grep -c 'zodl\.com' || true)
            if [ "$left" -ne 0 ]; then
              echo "::error::$library embeds a zodl.com host that is not in OHTTP_VOTE_HOSTS ($left strings)."
              failed=1
            fi
          done
          exit "$failed"
      # Note that GitHub Actions appears to have issues with environment variables that contain periods,
      # so the GPG variables are done as command line arguments instead.
      # publishToMavenCentral runs the cargoBuild tasks again (they have no up-to-date check), which
      # does not fit in 8 minutes (the step timed out on 2026-11-09).
      - name: Deploy to Maven Central
        timeout-minutes: 45
        env:
          ORG_GRADLE_PROJECT_IS_SNAPSHOT: false
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_ZCASH_ASCII_GPG_KEY: ${{ secrets.MAVEN_SIGNING_KEY_ASCII }}
        run: |
          ./gradlew publishToMavenCentral
      - name: Collect Artifacts
        timeout-minutes: 1
        if: ${{ always() }}
        env:
          ARTIFACTS_DIR_PATH: ${{ format('{0}/artifacts', env.home) }}
          BINARIES_ZIP_PATH: ${{ format('{0}/artifacts/release_binaries.zip', env.home) }}
        run: |
          mkdir ${ARTIFACTS_DIR_PATH}

          zip -r ${BINARIES_ZIP_PATH} . -i *build/outputs/*
      - name: Upload Artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        timeout-minutes: 10
        with:
          name: Release binaries
          path: ~/artifacts
