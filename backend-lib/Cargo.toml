[package]
name = "zcash-android-wallet-sdk"
version = "3.2.0"
authors = [
    "Jack Grigg <jack@z.cash>",
    "Kevin Gorham <kevin.gorham@z.cash>",
]
description = "JNI backend for the Android wallet SDK"
publish = false
edition = "2024"
rust-version = "1.92"

[features]
# `android-test-fixtures` stays out of default; it must never be enabled for production
# native builds.
default = []
# Enables JNI helpers that are only used by Android instrumentation tests.
# This feature must not be enabled for production native builds.
android-test-fixtures = []
# Enables the Slipstream sync-engine JNI surface (src/main/rust/slipstream/) and pulls in the
# git-pinned `slipstream-core` engine dependency, its tokio runtime, the env-filter for the
# module's logging setup, and (on Android) the logcat tracing layer. OFF by default; enabled
# for the merged native library that ships Slipstream.
slipstream = ["dep:slipstream-core", "dep:tokio", "dep:tracing-android", "tracing-subscriber/env-filter"]

[dependencies]
# Zcash dependencies

# Ironwood (NU6.3): resolves from crates.io — the published 0.15.4 carries the ZIP 374 support
# the old git pin provided, so no orchard [patch] entry is needed (and slipstream-core requires
# ^0.15.4, which it satisfies).
#
# `unstable-voting-circuits` is not requested here, but it IS enabled in the built graph:
# re-enabling shielded voting brings it back transitively, because `zcash_voting` and its
# `voting-circuits` dependency both ask orchard for it (`cargo tree -i voting-circuits` shows
# the single path). Cargo features are additive, so naming it here would change nothing; the
# way to keep the share-reveal circuit out of the shipped library is to drop voting itself,
# not to drop this feature.
orchard = "0.15"
zcash_pool_migration = { version = "0.1.0", features = ["wallet"] }
# `signer` is this branch's addition, for the Keystone batch-signing recipe below
# (`pczt::roles::signer::batch`).
pczt = { version = "0.9.0", features = ["prover", "orchard", "sapling", "signer"] }
sapling = { package = "sapling-crypto", version = "0.7", default-features = false }
transparent = { package = "zcash_transparent", version = "0.10", default-features = false }
zcash_address = "0.13"
zcash_client_backend = { version = "0.24.0", features = [
    "orchard",
    "lightwalletd-tonic-tls-webpki-roots",
    "tor",
    "transparent-inputs",
    "unstable",
    "pczt",
] }
zcash_client_sqlite = { version = "0.22.0", features = ["orchard", "transparent-inputs", "unstable", "serde"] }
zcash_note_encryption = "0.4.1"
zcash_primitives = "0.30"
zcash_proofs = "0.30"
zcash_protocol = "0.10"
zcash_script = "0.4"
zip32 = "0.2"
# TODO: temporary git-rev pin -- switch to a published crates.io release once payment_uri ships
# one. Pinned to the zcash/librustzcash#2989 merge commit specifically (not main's moving tip),
# so this doesn't pick up unrelated later changes; that merge commit is a permanent part of
# main's history now, so it stays reachable even as main moves on.
payment_uri = { git = "https://github.com/zcash/librustzcash.git", rev = "330e4c0aa9e25199acdb93a56bf70126d0d3f2b9", features = ["json"] }
# Used by migration_finalize.rs to read `ShardTreeError`/`QueryError` variants when checking
# note-witness availability at a migration transaction's anchor boundary.
shardtree = "0.7"
# Used by voting/notes.rs to construct historical Orchard witness positions.
incrementalmerkletree = { version = "0.8", default-features = false }

# Infrastructure
prost = "0.14"
rusqlite = "0.37"
secrecy = "0.8"
# `zcash_voting::RoundBinding::hotkey_secret` is `Option<zeroize::Zeroizing<Vec<u8>>>`; this
# crate is already in the dependency graph transitively (via zcash_voting), but must be a
# direct dependency to name `zeroize::Zeroizing` here. Version pinned to match Cargo.lock's
# existing resolution (1.9.0) rather than introducing a second copy.
zeroize = { version = "1", default-features = false }
rand = "0.8"
nonempty = "0.11"

# HTTP
bytes = "1"
http = "1"
http-body-util = "0.1"

# Initialization
rayon = "1.7"

# JNI
anyhow = "1"
jni = { version = "0.21", default-features = false }
uuid = "1"
bitflags = "2"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# lightwalletd
tonic = "0.14"

# Logging
log-panics = "2.0.0"
paranoid-android = "0.2"
tracing = "0.1"
tracing-subscriber = "0.3"

# Conditional access to newer NDK features
dlopen2 = "0.8"
libc = "0.2"

# Tor
fs-mistrust = "0.12"
tor-rtcompat = "0.35"
rust_decimal = { version = "1", default-features = false, features = ["c-repr"] }
# - The "static" feature is required for the "compression" default feature of arti-client.
xz2 = { version = "0.1", features = ["static"] }

# Shielded voting
#
# `zcash_voting` provides client-side primitives for shielded voting. The Android JNI
# boundary is `src/main/rust/voting.rs`.
#
# Kept enabled here after the maint/v3.0.x cascade merge (see PR #2183, which disabled
# voting only on that maintenance line, not on main).
#
# 2.0.0-rc.3 resolves from crates.io, with no `[patch.crates-io]` entry. Earlier releases
# (0.11, 1.0) pinned the pre-Ironwood librustzcash family, which cargo resolved alongside
# this crate's Ironwood family and duplicated eight Zcash crates in the native library
# (issue #2056); that is what the git patch existed to avoid. The published 2.0.0-rc.3
# pins the Ironwood family directly, so each Zcash crate resolves exactly once without one.
#
# The transitive `voting-circuits` dependency contains the share-reveal circuit
# and the Poseidon-based `share_nullifier_hash` implementation:
# https://github.com/valargroup/voting-circuits/blob/v0.8.0/voting-circuits/src/share_reveal/circuit.rs
#
# To re-enable: uncomment these three, add `unstable-voting-circuits` back to the
# orchard dependency above, and build with `--cfg zcash_voting`. The 2.0 sources this
# tree is written against are a published crates.io release, so no `[patch.crates-io]`
# entry is needed. `incrementalmerkletree` above stays uncommented either way -- the
# migration engine uses it too.
#
# 2.0.0-rc.5 (adopted 2026-08-11, see #2161) is the first published release with the
# `tx1_effects` field delegate-vote submissions need — the vote-chain server rejects the
# legacy `sighash`-only shape with "invalid message field: tx1 effects must be 821 bytes,
# got 0". Earlier rc.4 only had this fix via an unpublished git pin (see the removed
# `[patch.crates-io]` entry below); rc.5 ships it on crates.io directly.
#
# 4.0.0 (unreleased — git rev pin, not yet on crates.io) adopts the breaking circuit +
# verification-key change from `voting-circuits` that expands the supported proposal-ID
# and atomic-vote-batch range from 1-15 to 1-50, and adds `cast-vote-batch` atomic
# multi-proposal submission. Stage's vote-chain server upgraded to this verifying key on
# ~2026-09-10 (confirmed by Valar/Adam, #ext-zodl-valargroup); any older client's proof
# is rejected with "ConstraintSystemFailure" against stage now. `zcash_voting`'s own
# default feature is `zakura` (Valar's alternate crypto backend, ~4.2MB of duplicate
# orchard/halo2/pasta_curves/bls12_381/client-backend/client-sqlite code with zero
# sharing with our existing librustzcash deps) — `lrz` selects the librustzcash-backed
# implementation instead, which resolves to the EXACT versions already in this Cargo.lock.
#
# Pin history: originally copied from Vizor's WIP branch on 2026-09-11, pointing at
# `98785d2b544b3f39e9b525e3a87421dcfa67d172` (2026-09-08). By 2026-09-11 upstream had
# REBASED main past that point -- 98785d2 became unreachable from valargroup/zcash_voting's
# main (confirmed via `git merge-base --is-ancestor`, not just "behind"). Re-pinned
# 2026-09-11 to `0eccfe692068e394991c143a0bac5ecbff753bf1`, confirmed live via
# `git ls-remote https://github.com/valargroup/zcash_voting.git HEAD` to be the actual
# current main tip at re-pin time (matches the iOS team's independently-chosen pin for
# the same 4.0 port on zodl-swift-wallet-sdk). The diff between the old and new pin is
# substantial (141 files, +13321/-1423 lines) -- re-verify any crate-API assumption made
# before this comment against the new rev, do not assume anything carried over unchanged.
#
# Re-pinned again 2026-09-14, briefly, to the tagged release `v4.0.0-rc.1`
# (`44869c8b2e49e2190e54582cded54d73fc187dd9`) chasing Roman/Valargroup's (#ext-zodl-valargroup,
# 2026-09-14) note that rc.1 "makes the voting-circuits version dependency compatible between the
# vote chain and zcash_voting" -- suspected fix for stage's 5 live "37 Questions" test rounds
# (vote_end_time 2026-09-17 19:27 UTC, status=1/ACTIVE, confirmed present directly against
# stage.vote-chain-primary.valargroup.org/shielded-vote/v1/rounds) being silently absent from the
# wallet's round list (fetchAllRounds() drops any round that fails authenticateVotingSessionOrNull,
# no error surfaced). REVERTED within the hour: rc.1 turned out to be on a DIFFERENT, older release
# lineage that never received the round-executor work at all -- confirmed via
# `git merge-base 0eccfe69 44869c8` = `53804a6e` (v3.0.0-rc.3), ~50 commits before PR #287 "Round
# executor, typed errors, delegation pipeline, routed transport, shared sidecar" (6fa5c65), and a
# full-history grep of the rc.1 checkout found zero occurrences of RoundExecutor/RoundDriver/
# HelperClient/ChainSubmissionControl/ShareTrackingDriver/DelegationPipeline/RouteHttp anywhere.
# Whatever Valargroup tags "4.0.0" is apparently a separate line from the `main` snapshot we
# originally pinned (0eccfe69, 2026-09-11) that already contained this architecture pre-release.
#
# Re-pinned 2026-09-14 (same day) to `v5.0.0` (`c2c99eb5e254cbbf778a96c0c911d6b898f45849`). The
# CHANGELOG says outright "This release is zcash_voting 5.0.0 and supersedes the 4.0.0 prerelease
# series" -- confirmed via `git merge-base --is-ancestor 0eccfe69 c2c99eb5` = true, i.e. v5.0.0 IS
# a genuine linear descendant of our original pin (same architecture, not a rewrite). It includes
# `65ec13fc` "chore: update voting-circuits to 0.12.1 (#346)" by Roman, 2026-09-13 -- one day
# before his Slack message, and a much stronger candidate for the actual compatibility fix than
# rc.1's abandoned line. Roman's Slack guidance was "stay on 4.0.x for the Retroactive Grants vote,
# 5.0.x adds batch-vote functionality with meaningfully higher integration complexity" -- but we
# are NOT adopting 5.0.0's new batching APIs here, only moving our existing round-executor
# integration forward along its own architecture line to pick up the circuits-version fix; the
# batch-vote complexity Roman warned about is opt-in surface we don't have to touch.
#
# Re-pinned 2026-09-22 to the tagged release `v5.1.0` (`67edd7eb797f66163c93ec66861f96ef7cffc4ae`),
# discovered live this session to be three releases ahead of our v5.0.0 pin. v5.0.0's own
# CHANGELOG carries a known-issue notice ("rejects vote-chain configurations containing more than
# eight endpoints. Use 5.0.1 instead.") that this pin was shipping with unnoticed. Picks up three
# fixes on the way to 5.1.0: v5.0.1 raises that endpoint limit to 100; v5.0.2 fixes a WAL-writer
# race in `store_vote` (was failing immediately with "database is locked" instead of honoring the
# configured busy timeout under concurrent vote-commitment persistence) and, more importantly, a
# network-triggerable panic in vote-tree sync -- over-capacity leaves / non-increasing checkpoints
# from a vote-tree endpoint now return typed sync errors instead of panicking the wallet, believed
# to be the fix for a High-severity crate-panic finding from an earlier security review of this
# integration -- plus a vote-chain replica-failover hardening fix during exact commitment-tree
# recovery; v5.1.0 itself adds only one purely additive, opt-in feature (Ledger hardware-wallet
# output review via `DelegationPipeline::with_ledger_output_review()`) which this codebase does not
# use (Keystone, not Ledger). Content-verified this session: our pinned rev's `zcash_voting/src`
# tree is byte-identical to the commit where the v5.1.0 line's history diverges from our
# release-branch's history (`git diff --stat` empty) -- the two lines diverged only in git
# topology (separate release-branch vs. mainline commits, standard backport-PR mechanics), not in
# file content at that point; `git merge-base --is-ancestor` fails in both directions from our pin
# to v5.1.0 in a plain local clone, which is expected given that topology and is not a red flag on
# its own. The diff from v5.0.2 (a confirmed linear descendant of our pin) to v5.1.0 touches
# exactly action.rs, delegate.rs, delegation_pipeline/mod.rs, delegation_pipeline/proving.rs,
# storage/operations.rs, and one new test file -- consistent with the CHANGELOG's Ledger-review
# description, no unexplained scope. No breaking-changes section is listed in the CHANGELOG for
# 5.0.1, 5.0.2, or 5.1.0 (unlike 5.0.0's own breaking-changes list relative to 4.x, which this SDK
# already adapted to). This bump adopts no new API surface -- it exists purely to pick up the
# three fixes above and stay current.
zcash_voting = { git = "https://github.com/valargroup/zcash_voting.git", rev = "67edd7eb797f66163c93ec66861f96ef7cffc4ae", default-features = false, features = ["lrz"] }

# The delegation-submission signing recipe (voting/delegation.rs) derives the account
# SpendAuth key locally and needs the same Pallas scalar/field types zcash_voting and
# orchard already carry transitively; pin to the versions already resolved for them
# (see Cargo.lock) so this stays the same crate instance, not a second copy.
pasta_curves = { version = "0.5" }
ff = { version = "0.13" }

# Slipstream sync engine. Its JNI binding is folded into this crate as the `slipstream` module
# (src/main/rust/slipstream/), gated by the off-by-default `slipstream` feature above, so the
# `Java_com_zodl_slipstream_*` exports link into THIS cdylib instead of a separate
# libslipstream.so. This is the merged-library shape iOS already has (one libzcashlc, one
# bundled SQLite): backend-lib's own bundled rusqlite and the engine's must be the SAME SQLite
# instance in the SAME process, or closing one connection drops the other's fcntl locks out
# from under it (the dual-instance SIGBUS/disk-I/O hazard; see
# docs/slipstream/android/worklog/ARCHIVE-phases-0-9.md for the full writeup). The engine is
# the published `zodl-slipstream` crate from crates.io, built against the same librustzcash
# generation as the rest of this graph — verify with `cargo tree -d` after any bump.
slipstream-core = { package = "zodl-slipstream", version = "0.1", optional = true }
# The module's owned engine runtime (HOSTING.md §3.1) and the logcat logging layer it wires up.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"], optional = true }

# Keystone hardware-wallet batch signing for the Orchard migration flow.
#
# The compiled `keystone-sdk-android` AAR this project's Kotlin layer otherwise depends on
# (co.electriccoin.zcash ui-lib) is stale (last release Oct 2025) and has no batch-signing API —
# only single-PCZT `generatePczt`/`parsePczt`. Batch signing for Zcash (firmware + these UR
# envelope types) was added to the Keystone ecosystem within the last month, but hasn't reached a
# new Android SDK release yet. `chainapsis/vizor-wallet` (a different Zcash wallet, run by the
# same contributors behind the Keystone firmware/core PRs) bypasses the compiled AAR entirely by
# depending on `keystone-sdk-rust`'s `ur-registry` crate and `ur-rs` directly from git — this
# mirrors that exact, verified-working pattern instead of waiting on an Android SDK release.
# The actual batching primitive is `pczt::roles::signer::batch` (see the `signer` feature above),
# not Keystone-specific; these crates only provide the outer UR/QR envelope.
ur = { git = "https://github.com/KeystoneHQ/ur-rs", tag = "0.3.3" }
ur-registry = { git = "https://github.com/KeystoneHQ/keystone-sdk-rust", package = "ur-registry", default-features = false, features = ["std"] }

# Android-only logcat backend for the `slipstream` module's tracing setup (used only under
# `#[cfg(target_os = "android")]`). Optional and activated by the `slipstream` feature; never
# compiled on the host `cargo check`.
[target.'cfg(target_os = "android")'.dependencies]
tracing-android = { version = "0.2", optional = true }

[dev-dependencies]
# Test-only: converts a BIP-39 mnemonic phrase to seed bytes for `migration::live_wallet_tests`,
# which needs a real UnifiedSpendingKey to exercise the in-process-signing path
# (`commit_preparation`) against a real wallet DB fixture — the app itself never uses this crate
# (Kotlin does the mnemonic-to-seed conversion, Rust always receives already-derived seed bytes).
bip0039 = "0.12"

# Test-only: pulls in `zcash_client_sqlite::testing` (`TestDb`/`TestDbFactory`/`BlockCache`) and,
# through it, `zcash_client_backend::data_api::testing::TestBuilder` — a synthetic, self-contained
# wallet DB with real chain/checkpoint history, no fixture file required. Used by
# `migration::wallet_rewind_tests` to prove the wallet's own `WalletWrite::truncate_to_height`
# (the same call our `rewindToHeight` JNI entry point makes) demotes a `Mined` migration
# transaction through `zcash_client_sqlite`'s internal pool-migration truncation wiring. Cargo
# unions this feature set with the `[dependencies]` entry above only for test/bench/example
# builds, so the release library never links tempfile/rand_chacha/ambassador.
zcash_client_sqlite = { version = "0.22.0", features = ["orchard", "transparent-inputs", "unstable", "serde", "test-dependencies"] }

[lib]
name = "zcashwalletsdk"
path = "src/main/rust/lib.rs"
crate-type = ["staticlib", "cdylib"]

# This crate is its own single-package workspace. The former nested slipstream-jni crate (which
# required an `exclude` here) is gone — its code is now the `slipstream` module of this crate.
[workspace]

[patch.crates-io]
# `slipstream-core` is deliberately absent here: since the engine's history rewrite to the
# published `zodl-slipstream` 0.1.x line, the dependency above resolves from crates.io like
# the rest of the released family — the old git pin was not dropped by accident.
#
# `zcash_voting` is also deliberately absent (removed 2026-08-11, see #2161): now that
# 2.0.0-rc.5 ships the `tx1_effects` fix on crates.io directly (see the dependency entry
# above), the unpublished git pin this patch used to carry is no longer needed.

# DO NOT ALTER THIS COMMENT
#
# This section is left in place to ensure that development against in-progress
# librustzcash changes my proceed. DO NOT merge a PR that chooses unstable
# revisions; such a revision need not be merged to `librustzcash `main` but the
# author and reviewer should have certainty that the revision *will end up
# merged to `main`* so that commits in our history can always be successfully
# built. 
#pczt = { git = "https://github.com/zcash/librustzcash", rev = "REPLACE_ME" }
#zcash_address = { git = "https://github.com/zcash/librustzcash", rev = "REPLACE_ME" }
#zcash_client_backend = { git = "https://github.com/zcash/librustzcash", rev = "REPLACE_ME" }
#zcash_client_sqlite = { git = "https://github.com/zcash/librustzcash", rev = "REPLACE_ME" }
#zcash_keys = { git = "https://github.com/zcash/librustzcash", rev = "REPLACE_ME" }
#zcash_pool_migration = { git = "https://github.com/zcash/librustzcash", rev = "REPLACE_ME" }
#zcash_primitives = { git = "https://github.com/zcash/librustzcash", rev = "REPLACE_ME" }
#zcash_proofs = { git = "https://github.com/zcash/librustzcash", rev = "REPLACE_ME" }
#zcash_protocol = { git = "https://github.com/zcash/librustzcash", rev = "REPLACE_ME" }
#zcash_transparent = { git = "https://github.com/zcash/librustzcash", rev = "REPLACE_ME" }
#zip321 = { git = "https://github.com/zcash/librustzcash", rev = "REPLACE_ME" }
